# Publishes ALFinity to GitHub Pages whenever main changes.
# Only the app files are published (not specs/, tests/, scripts/ or .specify/).
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push replaces a waiting one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run logic tests
        run: node --test "tests/*.test.js"

      - name: Collect app files
        run: |
          mkdir _site
          cp -R *.html manifest.webmanifest sw.js css js icons _site/
          mkdir _site/images
          cp images/*.jpg _site/images/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
